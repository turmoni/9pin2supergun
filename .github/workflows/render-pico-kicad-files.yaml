name: Render KiCad files (PCB)
on:
  push:
    paths:
      - "pico_reference/*.kicad_*"
jobs:
  generate_files:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Render project
        uses: sparkengineering/kicad-action@v4
        id: production
        with:
          kicad_sch: pico_reference/9pin2supergun.kicad_sch
          sch_pdf: true
          sch_bom: true 
          kicad_pico_reference: pico_reference/9pin2supergun.kicad_pico_reference
          pico_reference_gerbers: true
          pico_reference_image: true
      - name: Upload production files
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.production.conclusion == 'success' }}
        with:
          name: pico_reference-rendered
          path: |
            ${{ github.workspace }}/pico_reference/sch.pdf
            ${{ github.workspace }}/pico_reference/gbr.zip
            ${{ github.workspace }}/pico_reference/bom.csv
            ${{ github.workspace }}/pico_reference/images/top.png
            ${{ github.workspace }}/pico_reference/images/bottom.png
      - name: Download production files
        uses: actions/download-artifact@v4
        with:
          name: pico_reference-rendered
          path: ${{github.workspace}}/pico_reference/rendered
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Render schematics and gerbers
          file_pattern: "pico_reference/rendered/*"
